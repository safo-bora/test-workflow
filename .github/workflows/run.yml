permissions:
  contents: read

jobs:
  debug:
    name: "Debug ${{ inputs.environment }}"
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Read selected environment from config
        env:
          SELECTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python <<'PY'
          import os
          import sys

          import yaml

          with open("config/config-environments.yml", encoding="utf-8") as file:
              config = yaml.safe_load(file)

          available = {
              item["environment"]: item
              for environments in config.values()
              for item in environments
          }

          selected = os.environ["SELECTED_ENVIRONMENT"]
          if selected not in available:
              print(f"Unknown environment: {selected}", file=sys.stderr)
              sys.exit(1)

          environment = available[selected]
          print(f"Environment: {environment['environment']}")
          print(f"Base URL: {environment['base_url']}")
          print(f"API URL: {environment['base_api_url']}")
          print("Debug completed successfully.")
          PY
