name: Run selected environments

run-name: "Debug: ${{ inputs.environments }}"

on:
  workflow_dispatch:
    inputs:
      environments:
        description: "Environment names separated by commas"
        required: true
        type: string
        default: "test-blue-01,test-green-01"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Build matrix from config
        id: matrix
        env:
          SELECTED_ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          python <<'PY'
          import json
          import os
          import sys

          import yaml

          with open("config-environments.yml", encoding="utf-8") as file:
              config = yaml.safe_load(file)

          available = {
              item["environment"]: item
              for environments in config.values()
              for item in environments
          }

          selected = [
              name.strip()
              for name in os.environ["SELECTED_ENVIRONMENTS"].split(",")
              if name.strip()
          ]
          selected = list(dict.fromkeys(selected))

          unknown = [name for name in selected if name not in available]
          if unknown:
              print(f"Unknown environments: {', '.join(unknown)}", file=sys.stderr)
              sys.exit(1)

          if not selected:
              print("Enter at least one environment.", file=sys.stderr)
              sys.exit(1)

          matrix = [available[name] for name in selected]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  "matrix="
                  + json.dumps(matrix, separators=(",", ":"))
                  + "\n"
              )

          print(f"Selected {len(matrix)} environment(s): {', '.join(selected)}")
          PY

  debug:
    name: "Debug ${{ matrix.environment }}"
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Show selected environment
        env:
          ENVIRONMENT_NAME: ${{ matrix.environment }}
          BASE_URL: ${{ matrix.base_url }}
          BASE_API_URL: ${{ matrix.base_api_url }}
        run: |
          echo "Environment: ${ENVIRONMENT_NAME}"
          echo "Base URL: ${BASE_URL}"
          echo "API URL: ${BASE_API_URL}"
          echo "Debug completed."
