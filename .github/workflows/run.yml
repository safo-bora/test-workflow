name: Run selected environments

run-name: "${{ inputs.test_type }} on selected environments by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      test_blue_01:
        description: "test-blue-01"
        type: boolean
        required: false
        default: false
      test_blue_02:
        description: "test-blue-02"
        type: boolean
        required: false
        default: false
      test_blue_03:
        description: "test-blue-03"
        type: boolean
        required: false
        default: false
      test_blue_04:
        description: "test-blue-04"
        type: boolean
        required: false
        default: false
      test_blue_05:
        description: "test-blue-05"
        type: boolean
        required: false
        default: false
      test_blue_06:
        description: "test-blue-06"
        type: boolean
        required: false
        default: false
      test_blue_07:
        description: "test-blue-07"
        type: boolean
        required: false
        default: false
      test_blue_08:
        description: "test-blue-08"
        type: boolean
        required: false
        default: false
      test_blue_09:
        description: "test-blue-09"
        type: boolean
        required: false
        default: false
      test_blue_10:
        description: "test-blue-10"
        type: boolean
        required: false
        default: false
      test_blue_11:
        description: "test-blue-11"
        type: boolean
        required: false
        default: false
      test_blue_12:
        description: "test-blue-12"
        type: boolean
        required: false
        default: false
      test_blue_13:
        description: "test-blue-13"
        type: boolean
        required: false
        default: false
      test_blue_14:
        description: "test-blue-14"
        type: boolean
        required: false
        default: false
      test_blue_15:
        description: "test-blue-15"
        type: boolean
        required: false
        default: false
      test_blue_16:
        description: "test-blue-16"
        type: boolean
        required: false
        default: false
      all_environments:
        description: "ALL — run every environment from the config"
        type: boolean
        required: false
        default: false

      test_type:
        description: "Test type to run. Use infer-from-selector when a test case ID is provided."
        type: choice
        required: true
        options:
          - infer-from-selector
          - api-schema
          - api-regression
          - ui-regression
          - fmp-ui-regression

      feature_tag:
        description: "Test selector by tag. Select all to run all tests."
        type: choice
        required: true
        options:
          - all
          - pr
          - smoke
          - nightly

      test_selector_id:
        description: "Test case ID(s), comma-separated"
        type: string
        required: false

      test_selector_title:
        description: "Test selector by title"
        type: string
        required: false

      thread_count:
        description: "Thread count for pytest-xdist"
        type: choice
        required: true
        options:
          - auto
          - "2"
          - "4"
          - "8"

      xray_test_plan_id:
        description: "Xray Test Plan ID (optional)"
        type: string
        required: false

      xray_test_execution_id:
        description: "Xray Test Execution ID (optional)"
        type: string
        required: false

      ui_feature_tag:
        description: "UI feature folder. Select all to run all UI tags."
        type: choice
        required: true
        options:
          - all
          - obligations
          - matters
          - search

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare environment matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Build matrix from environment checkboxes
        id: matrix
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: |
          python <<'PY'
          import json
          import os
          import sys

          import yaml

          with open("config/config-environments.yml", encoding="utf-8") as file:
              config = yaml.safe_load(file)

          available = {
              item["environment"]: item
              for environments in config.values()
              for item in environments
          }
          inputs = json.loads(os.environ["WORKFLOW_INPUTS"])

          if inputs["all_environments"]:
              selected = list(available)
          else:
              selected = [
                  key.replace("_", "-")
                  for key, checked in inputs.items()
                  if key.startswith("test_blue_") and checked
              ]

          if not selected:
              print("Select at least one environment or select ALL.", file=sys.stderr)
              sys.exit(1)

          unknown = [name for name in selected if name not in available]
          if unknown:
              print(f"Missing from config: {', '.join(unknown)}", file=sys.stderr)
              sys.exit(1)

          matrix = [available[name] for name in selected]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")

          print(f"Selected {len(matrix)} environment(s): {', '.join(selected)}")
          PY

  debug:
    name: "${{ inputs.test_type }} — ${{ matrix.environment }}"
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Show mock test configuration
        env:
          ENVIRONMENT_NAME: ${{ matrix.environment }}
          BASE_URL: ${{ matrix.base_url }}
          BASE_API_URL: ${{ matrix.base_api_url }}
          TEST_TYPE: ${{ inputs.test_type }}
          FEATURE_TAG: ${{ inputs.feature_tag }}
          TEST_SELECTOR_ID: ${{ inputs.test_selector_id }}
          TEST_SELECTOR_TITLE: ${{ inputs.test_selector_title }}
          THREAD_COUNT: ${{ inputs.thread_count }}
          XRAY_TEST_PLAN_ID: ${{ inputs.xray_test_plan_id }}
          XRAY_TEST_EXECUTION_ID: ${{ inputs.xray_test_execution_id }}
          UI_FEATURE_TAG: ${{ inputs.ui_feature_tag }}
        run: |
          echo "Environment: ${ENVIRONMENT_NAME}"
          echo "Base URL: ${BASE_URL}"
          echo "API URL: ${BASE_API_URL}"
          echo "Test type: ${TEST_TYPE}"
          echo "Feature tag: ${FEATURE_TAG}"
          echo "Test case IDs: ${TEST_SELECTOR_ID}"
          echo "Test title: ${TEST_SELECTOR_TITLE}"
          echo "Threads: ${THREAD_COUNT}"
          echo "Xray Test Plan: ${XRAY_TEST_PLAN_ID}"
          echo "Xray Test Execution: ${XRAY_TEST_EXECUTION_ID}"
          echo "UI feature: ${UI_FEATURE_TAG}"
          echo "Mock run completed."
