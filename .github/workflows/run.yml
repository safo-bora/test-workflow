permissions:
  contents: read

jobs:
  prepare:
    name: Prepare environment matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Build matrix from selected checkboxes
        id: matrix
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: |
          python <<'PY'
          import json
          import os
          import sys

          import yaml

          with open("config/config-environments.yml", encoding="utf-8") as file:
              config = yaml.safe_load(file)

          available = {
              item["environment"]: item
              for environments in config.values()
              for item in environments
          }

          inputs = json.loads(os.environ["WORKFLOW_INPUTS"])

          if inputs["all_environments"]:
              selected = list(available)
          else:
              selected = [
                  key.replace("_", "-")
                  for key, checked in inputs.items()
                  if key != "all_environments" and checked
              ]

          if not selected:
              print("Select at least one environment or select ALL.", file=sys.stderr)
              sys.exit(1)

          unknown = [name for name in selected if name not in available]
          if unknown:
              print(f"Missing from config: {', '.join(unknown)}", file=sys.stderr)
              sys.exit(1)

          matrix = [available[name] for name in selected]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              output.write(f"count={len(matrix)}\n")

          print(f"Selected {len(matrix)} environment(s):")
          for name in selected:
              print(f"- {name}")
          PY

  debug:
    name: "Debug ${{ matrix.environment }}"
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Show selected environment
        env:
          ENVIRONMENT_NAME: ${{ matrix.environment }}
          BASE_URL: ${{ matrix.base_url }}
          BASE_API_URL: ${{ matrix.base_api_url }}
        run: |
          echo "Environment: ${ENVIRONMENT_NAME}"
          echo "Base URL: ${BASE_URL}"
          echo "API URL: ${BASE_API_URL}"
          echo "Debug completed."
